<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Alignment Example</title>
    <style>
        .text-container {
            display: flex;
            flex-direction: column;
            align-items: center; /* Aligns text in the center */
            text-align: center;
        }

        .text-normal {
            font-size: 20px;
            letter-spacing: 0; /* No letter spacing */
        }

        .text-spaced {
            font-size: 20px;
            letter-spacing: 2px; /* Custom letter spacing */
        }
    </style>
</head>
<body>
    <div class="text-container">
        <div class="text-normal">This is normal text.</div>
        <div class="text-spaced">This text has spacing.</div>
    </div>
</body>
</html>
